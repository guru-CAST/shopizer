parameters:
- name: clean
  displayName: Checkout clean
  type: boolean
  default: false
  values:
  - false
  - true

trigger:
- main

jobs:
- job: CO
  pool: 
    vmImage: 'ubuntu-24.04'
  #pool:
    #name: default 

  steps:
  - checkout: self
    clean: ${{ parameters.clean }}

  - script: |
      echo Checkout completed
      echo    Running copy now...
    displayName: 'Run a multi-line script'
  
- job: CP
  pool: Default
  dependsOn: CO
  condition: succeeded('CO')
  
  steps:
  - task: CopyFiles@1
    inputs:
      sourceFolder: '$(Build.SourcesDirectory)'
      TargetFolder: C:\azure\agent\_src\shopizer
      CleanTargetFolder: true

#  - task: CmdLine@1
#    inputs:
#      filename: C:\tools\agent\_hl_scripts\HL-scan_Shopizer.bat
#      #arguments: 

  - task: Docker@2
    inputs:
      containerRegistry: 'hl-docker'
      repository: 'https://hub.docker.com/r/casthighlight/cli'
      command: 'run'
      arguments: '-v $(Build.SourcesDirectory):/src_dir -v $(Agent.TempDirectory):/work_dir casthighlight/cli –sourceDir src_dir –workingDir work_dir –skipUpload'
